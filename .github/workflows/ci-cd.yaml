name: CI/CD Pipeline

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*' # יריץ את ה-Build וה-Push אך ורק כשנדחפת תגית במבנה vX.Y.Z

jobs:
  # ====================================================
  # שלב 1: אימות, בדיקות יחידה וסריקות אבטחה
  # ====================================================
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies & Run Tests
        run: |
          npm ci
          npm run test:coverage --if-present
      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'
      - name: Lint Helm Chart
        run: |
          helm lint ./charts/sample-nodejs

  security-checks:
    needs: lint-and-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check-type: [gitleaks, semgrep, audit]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (for audit)
        if: matrix.check-type == 'audit'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Gitleaks
        if: matrix.check-type == 'gitleaks'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Semgrep SAST
        if: matrix.check-type == 'semgrep'
        uses: semgrep/semgrep-action@v1
        with:
          config: auto
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run npm audit
        if: matrix.check-type == 'audit'
        run: npm audit --audit-level=critical

  # ====================================================
  # שלב 2: בנייה, סריקת אימג' ודחיפה (רק ב-Release Tag)
  # ====================================================
  build-and-push:
    needs: [lint-and-test, security-checks]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # חילוץ הגרסה ללא ה-v (למשל מ-v1.0.1 ל-1.0.1)
      - name: Extract Release Version
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "RELEASE_VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building release version: ${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          push: false
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sample-nodejs:${{ steps.get_version.outputs.RELEASE_VERSION }}
          build-args: |
            APP_VERSION=${{ steps.get_version.outputs.RELEASE_VERSION }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/sample-nodejs:${{ steps.get_version.outputs.RELEASE_VERSION }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      - name: Push Docker Image to Registry
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sample-nodejs:${{ steps.get_version.outputs.RELEASE_VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/sample-nodejs:latest
          build-args: |
            APP_VERSION=${{ steps.get_version.outputs.RELEASE_VERSION }}

      # --------------------------------------------------
      # ה-Step להזרקת הסיקרט וביצוע הפריסה (Deploy)
      # --------------------------------------------------
      # 1. התקנת Helm ב-Runner
      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      # 2. הגדרת החיבור לקלאסטר Kubernetes
      - name: Set Kubernetes Context
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      # 3. ביצוע הפריסה לקלאסטר
      - name: Deploy Helm Chart
        run: |
          helm upgrade --install sample-nodejs ./charts/sample-nodejs \
            --namespace default \
            --set image.tag="${{ steps.get_version.outputs.RELEASE_VERSION }}" \
            --set secret.dbPassword="${{ secrets.DB_PASSWORD }}"