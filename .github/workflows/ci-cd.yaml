name: CI/CD & DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ----------------------------------------------------
  # שלב 1: אימות איכות קוד וטמפלטים (Linting & Testing)
  # ----------------------------------------------------
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies & Run Tests with Coverage
        run: |
          npm ci
          npm run test:coverage --if-present

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage-report
          path: coverage/

      - name: Lint Helm Chart
        run: |
          helm lint ./charts/sample-nodejs

  # ----------------------------------------------------
  # שלב 2: בדיקות אבטחה במקביל (Security Checks)
  # ----------------------------------------------------
  security-checks:
    needs: lint-and-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check-type: [gitleaks, semgrep, audit]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (for audit)
        if: matrix.check-type == 'audit'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Gitleaks
        if: matrix.check-type == 'gitleaks'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Semgrep SAST
        if: matrix.check-type == 'semgrep'
        uses: semgrep/semgrep-action@v1
        with:
          config: auto

      - name: Run npm audit
        if: matrix.check-type == 'audit'
        run: npm audit --audit-level=critical

  # ----------------------------------------------------
  # שלב 3: גזירת גרסה ותגיות (Version Bumping & Release)
  # ----------------------------------------------------
  version-release:
    needs: [lint-and-test, security-checks]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.set-ver.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute Build Tag
        id: set-ver
        run: |
          BASE_VER=$(node -p "require('./package.json').version")
          VERSION="${BASE_VER}-${GITHUB_RUN_NUMBER}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Generated version: ${VERSION}"

      - name: Configure Git & Create Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.set-ver.outputs.version }}"
          git push origin "v${{ steps.set-ver.outputs.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ----------------------------------------------------
  # שלב 4: בנייה, סריקת אימג' ודחיפה (Build, Trivy Scan & Push)
  # ----------------------------------------------------
  build-and-push:
    needs: version-release
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          push: false
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sample-nodejs:${{ needs.version-release.outputs.new_version }}
          build-args: |
            APP_VERSION=${{ needs.version-release.outputs.new_version }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/sample-nodejs:${{ needs.version-release.outputs.new_version }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      - name: Push Docker Image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sample-nodejs:${{ needs.version-release.outputs.new_version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/sample-nodejs:latest